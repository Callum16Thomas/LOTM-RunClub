<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routes — Longwood on the Move</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="brand-mark"></span>Longwood on the Move</a>
    <nav class="primary-nav" aria-label="Primary">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="routes.html" aria-current="page">Routes</a></li>
        <li><a href="events.html">Runs</a></li>
        <li><a href="blog.html">News</a></li>
        <li><a href="contact.html">Join</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <h2>Our routes</h2>
      <span class="section-note">Bib number is just for reference — pick a route and it'll load on the map.</span>
    </div>

    <div class="route-grid">
      <div id="route-list" class="route-list">
        <p class="empty-state">Loading routes…</p>
      </div>
      <div>
        <div id="map"></div>
        <div class="map-legend">
          <span><span class="swatch" style="background:#2E5C86"></span>Blue blaze — easy</span>
          <span><span class="swatch" style="background:#C99A2E"></span>Yellow blaze — moderate</span>
          <span><span class="swatch" style="background:#A83A2C"></span>Red blaze — hard</span>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>Longwood on the Move</span>
    <span><a href="contact.html">Get in touch</a></span>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet-gpx@1.7.0/gpx.js"></script>
<script src="js/routes.js"></script>
</body>
</html>
